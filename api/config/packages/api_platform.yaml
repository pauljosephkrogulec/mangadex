# API Platform (issue #20). Doc : https://api-platform.com/docs/core/configuration/
api_platform:
    title: Manga Reader API
    description: API du lecteur de mangas et webtoons.
    version: '%env(APP_VERSION)%'

    # Formats de sortie négociés via l'en-tête Accept. JSON-LD/Hydra par défaut (1er de la liste).
    formats:
        jsonld: ['application/ld+json']
        jsonapi: ['application/vnd.api+json']
        jsonhal: ['application/hal+json']
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json']
        jsonapi: ['application/vnd.api+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']

    # Swagger UI sur /api/docs. ReDoc et GraphiQL ne sont pas utilisés.
    enable_swagger_ui: true
    enable_re_doc: false

    # Erreurs au format RFC 7807 (issue #24), docs/developpement.md.
    # problem+json par défaut ; Hydra et JSON:API si le client les demande dans Accept.
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
        jsonapi: ['application/vnd.api+json']
        # Navigateur : page d'erreur HTML de Symfony (debug en dev), pas de JSON.
        html: ['text/html']

    # Les erreurs des contrôleurs Symfony classiques (ex. /api/health, route /api inconnue) passent
    # aussi par API Platform : même format partout. Les navigateurs (Accept: text/html) gardent la page HTML.
    handle_symfony_errors: true

    # Exceptions sans statut HTTP propre → statut (une sous-classe est aussi concernée).
    # Les exceptions métier (App\Exception\BusinessException) portent elles-mêmes leur statut.
    # Cette liste remplace celle d'API Platform : on y reprend ses valeurs par défaut.
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409
    # Pas de mapping d'exceptions Doctrine/DBAL : pour un statut < 500, le message devient le `detail`
    # renvoyé au client, et celui d'une exception SQL exposerait le schéma. Valider en amont
    # (UniqueEntity…) ou relancer une App\Exception\ConflictException avec un message maîtrisé.

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # Pagination : 30 éléments par page, le client peut demander jusqu'à 100 (`?itemsPerPage=`).
        pagination_enabled: true
        pagination_items_per_page: 30
        pagination_maximum_items_per_page: 100
        pagination_client_items_per_page: true

    collection:
        pagination:
            items_per_page_parameter_name: itemsPerPage

    # Swagger UI ne doit pas être servi en prod (surface d'attaque, doc publique non voulue).
    # La spec OpenAPI reste générable en CLI : `bin/console api:openapi:export`.
when@prod:
    api_platform:
        enable_swagger_ui: false
        enable_docs: false
        enable_entrypoint: false
