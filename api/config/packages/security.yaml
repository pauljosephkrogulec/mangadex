# Socle Symfony Security (issue #31) : refus par défaut des écritures du catalogue.
# Aucun moyen de s'authentifier hors des tests pour l'instant : l'entité User (#36) et le JWT (#37)
# brancheront leur provider et leur authenticator sur le firewall `main`. D'ici là, toute opération
# protégée par `is_granted('ROLE_ADMIN')` répond 401.
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    # Le premier hasher qui correspond à la classe de l'utilisateur l'emporte : les comptes en mémoire
    # sont déclarés avant l'interface générique pour pouvoir passer en clair dans les tests.
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Provider vide : remplacé par l'entité User avec #36.
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            # API sans session (api_platform.defaults.stateless) : chaque requête s'authentifie seule.
            stateless: true
            lazy: true
            provider: users_in_memory

    # Les règles d'accès sont portées par les opérations API Platform (`security:`), au plus près de la ressource.
    access_control: []

when@test:
    security:
        password_hashers:
            # Mots de passe en clair pour les comptes de test en mémoire ci-dessous.
            Symfony\Component\Security\Core\User\InMemoryUser: plaintext
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        providers:
            users_in_memory:
                memory:
                    users:
                        admin: { password: admin, roles: ['ROLE_ADMIN'] }
                        reader: { password: reader, roles: ['ROLE_USER'] }
        firewalls:
            main:
                # Tests uniquement : HTTP Basic pour jouer un rôle sans attendre le JWT (#37).
                http_basic: ~
