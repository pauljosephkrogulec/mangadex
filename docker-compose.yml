services:
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "/api"
      NODE_ENV: "production"
      NEXT_PUBLIC_SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ORG: "${SENTRY_ORG:-}"
      SENTRY_PROJECT: "${SENTRY_PROJECT:-}"
      SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN:-}"
    depends_on:
      - backend
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      APP_SECRET: "${APP_SECRET}"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE}"
      REDIS_URL: "redis://redis:6379"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./backend:/app  # Share backend code for static files
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-manga_reader}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-manga_reader}"]
      interval: 1s
      retries: 15
      timeout: 3s
      start_period: 5s

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
