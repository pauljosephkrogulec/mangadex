services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/manga_reader?serverVersion=15&charset=utf8"
    depends_on:
      - db
    networks:
      - app-network
 
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - app-network
 
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
 
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: manga_reader
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
