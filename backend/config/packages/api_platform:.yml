api_platform:
    title: 'Manga Reader API'
    description: 'API for manga-reader application'
    version: '1.0.0'
    mapping:
        paths: ['%kernel.project_dir%/src/ApiResource', '%kernel.project_dir%/src/Entity']

    # Default settings for all resources
    defaults:
        pagination_items_per_page: 20
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 100

    # Enable OpenAPI and documentation
    enable_swagger: true
    enable_docs: true
    enable_entrypoint: true

    # Enable all documentation UIs (disable in prod via env)
    enable_swagger_ui: '%env(bool:API_PLATFORM_ENABLE_UI)%'
    enable_re_doc: '%env(bool:API_PLATFORM_ENABLE_UI)%'
    enable_scalar: '%env(bool:API_PLATFORM_ENABLE_UI)%'

    # Collection settings (pagination)
    collection:
        pagination:
            enabled: true
            page_parameter_name: 'page'
            items_per_page_parameter_name: 'itemsPerPage'

    # Enable fetch join collection to prevent N+1 queries
    eager_loading:
        enabled: true

    # Only accept and return application/ld+json
    formats:
        jsonld:
            mime_types: ['application/ld+json']
