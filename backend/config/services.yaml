# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # User registration processor for password hashing
    App\State\Processor\UserRegistrationProcessor:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $decorated: '@App\State\Processor\UserRegistrationProcessor.inner'
        autowire: true

    # User update processor for password hashing
    App\State\Processor\UserUpdateProcessor:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $decorated: '@App\State\Processor\UserUpdateProcessor.inner'
        autowire: true

    # CustomList processor to set owner from security context
    App\State\Processor\CustomListProcessor:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $decorated: '@App\State\Processor\CustomListProcessor.inner'
        autowire: true

    # Comment processor to set author from security context
    App\State\Processor\CommentProcessor:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $decorated: '@App\State\Processor\CommentProcessor.inner'
        autowire: true

    # Include parameter handler for eager loading relationships
    App\Serializer\IncludeContextBuilder:
        decorates: 'api_platform.serializer.context_builder.filter'
        arguments:
            $decorated: '@api_platform.serializer.context_builder.filter.inner'
        autowire: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
