name: Release — Préparer

# Ouvre la PR de mise en prod `dev → main`, titrée `chore(release): vX.Y.Z`.
# Lancement : onglet Actions → « Release — Préparer » → Run workflow → saisir la version.
# Au merge de cette PR (en merge commit), `release-tag.yml` pose le tag sur `main`,
# ce qui déclenche la publication des images (`release-images.yml`).
#
# La PR est créée avec RELEASE_TOKEN (PAT) et non GITHUB_TOKEN : une PR ouverte par
# GITHUB_TOKEN ne déclenche aucun workflow, les checks requis ne tourneraient jamais.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à livrer (ex. v1.2.3 ou v1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique et tags complets pour comparer main et dev

      - name: Check RELEASE_TOKEN secret
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASE_TOKEN manquant (PAT fine-grained : Contents + Pull requests en écriture)."
            exit 1
          fi

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version invalide : '$VERSION' (attendu : vX.Y.Z ou vX.Y.Z-suffixe)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Le tag $VERSION existe déjà."
            exit 1
          fi

      - name: Check there is something to release
        run: |
          if [ -n "$(gh pr list --base main --head dev --state open --json number --jq '.[].number')" ]; then
            echo "::error::Une PR dev → main est déjà ouverte."
            exit 1
          fi
          if [ "$(git rev-list --count origin/main..origin/dev)" -eq 0 ]; then
            echo "::error::dev ne contient aucun commit absent de main : rien à livrer."
            exit 1
          fi

      - name: Build PR body
        run: |
          {
            echo "## Mise en prod $VERSION"
            echo
            echo "Commits livrés (\`main..dev\`) :"
            echo
            git log --no-merges --format='- %s (%h)' origin/main..origin/dev
            echo
            echo "---"
            echo
            echo "> [!IMPORTANT]"
            echo "> Merger avec **Create a merge commit** (pas de squash ni de rebase)."
            echo "> Au merge, le tag \`$VERSION\` est posé sur \`main\` et les images sont publiées."
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Open PR dev → main
        run: |
          url=$(gh pr create --base main --head dev \
            --title "chore(release): $VERSION" \
            --label release \
            --body-file "$RUNNER_TEMP/release-body.md")
          echo "PR de release : $url" >> "$GITHUB_STEP_SUMMARY"
