name: Keep-alive — API production

# Render Free endort un service après 15 min sans requête (réveil ≈ 1 min pour le visiteur suivant).
# Un ping toutes les 10 min garde l'API de prod éveillée… mais seulement en journée :
# les 750 h gratuites par mois sont partagées par tout le compte Render (prod + staging).
#   06:00–22:59 UTC ≈ 17 h/jour ≈ 530 h/mois pour la prod → ~220 h restent pour le staging.
# /api/health n'interroge pas la base : Neon peut rester en veille.
#
# Variable de dépôt requise : PROD_API_URL (ex. https://mangadex-api.onrender.com).
# NB : GitHub désactive les workflows planifiés après 60 jours sans activité sur le dépôt.

on:
  schedule:
    - cron: "*/10 6-22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROD_API_URL: ${{ vars.PROD_API_URL }}
    steps:
      - name: Ping production API
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "::notice::Variable PROD_API_URL non définie : rien à pinger."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "$PROD_API_URL/api/health"
