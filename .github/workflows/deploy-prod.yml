name: CD — Déploiement production

# Workflow réutilisable (workflow_call) : déploie une version publiée de l'API sur Render (prod).
# Appelé par :
#   - release-images.yml (tag vX.Y.Z)  → migrations + déploiement, 100 % automatique ;
#   - rollback-prod.yml (manuel)       → redéploiement d'une version précédente, sans migration.
# Le front de prod est déployé par Vercel depuis `main` (intégration Git), en parallèle.
#
# Configuration : GitHub → Settings → Environments → `production` (voir docs/deploiement.md).

on:
  workflow_call:
    inputs:
      version:
        description: "Tag à déployer (ex. v1.2.3) — l'image ghcr.io/<repo>-php:<1.2.3> doit exister"
        required: true
        type: string
      migrate:
        description: "Jouer les migrations Doctrine avant le déploiement"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API ${{ inputs.version }} (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.FRONT_URL }}
    # Un seul déploiement de prod à la fois, jamais interrompu (migrations !).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      IMAGE: ghcr.io/${{ github.repository }}-php
      VERSION: ${{ inputs.version }}
      MIGRATE: ${{ inputs.migrate }}
      API_URL: ${{ vars.API_URL }}
      FRONT_URL: ${{ vars.FRONT_URL }}

    steps:
      - name: Check production configuration
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version invalide : '$VERSION'."
            exit 1
          fi
          missing=""
          if [ "$MIGRATE" = "true" ] && [ -z "$DATABASE_URL_DIRECT" ]; then missing="$missing secret:DATABASE_URL_DIRECT"; fi
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || missing="$missing secret:RENDER_DEPLOY_HOOK_URL"
          [ -n "$API_URL" ] || missing="$missing variable:API_URL"
          [ -n "$FRONT_URL" ] || missing="$missing variable:FRONT_URL"
          if [ -n "$missing" ]; then
            echo "::error::Environnement GitHub 'production' incomplet :$missing (voir docs/deploiement.md)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On déploie un digest (immuable, celui qui a été signé), jamais un tag (déplaçable).
      - name: Resolve image digest
        run: |
          tag="${VERSION#v}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$digest" ]; then
            echo "::error::Image $IMAGE:$tag introuvable sur GHCR."
            exit 1
          fi
          echo "REF=$IMAGE@$digest" >> "$GITHUB_ENV"
          echo "Image à déployer : $IMAGE:$tag → $digest"

      # Avant le déploiement : la nouvelle version ne démarre que sur un schéma à jour.
      # URL *directe* de Neon (pas le pooler). Les migrations doivent rester compatibles avec la
      # version précédente du code (elle tourne encore pendant le déploiement).
      - name: Doctrine migrations (Neon production)
        if: inputs.migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL_DIRECT" "$REF" \
            bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS --get "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=$REF" -o /dev/null
          echo "Déploiement Render demandé : $REF"

      - name: Wait for new version on Render
        run: |
          for i in $(seq 1 60); do
            version=$(curl -fsS --max-time 30 "$API_URL/api/health" 2>/dev/null | jq -r '.version // empty' || true)
            if [ "$version" = "$VERSION" ]; then
              echo "API de production à jour ($version)."
              exit 0
            fi
            echo "[$i/60] version servie : ${version:-indisponible}, attendue : $VERSION"
            sleep 15
          done
          echo "::error::Render ne sert pas $VERSION après 15 minutes."
          exit 1

      # Smoke tests via le front de prod (Vercel) : page d'accueil + chaîne rewrite → Render → Symfony.
      - name: Smoke tests (front + API through rewrite)
        run: |
          for i in $(seq 1 40); do
            home=$(curl -fsS --max-time 30 "$FRONT_URL/" 2>/dev/null || true)
            health=$(curl -fsS --max-time 30 "$FRONT_URL/api/health" 2>/dev/null || true)
            if printf '%s' "$home" | grep -q "Mangadex" \
              && [ "$(printf '%s' "$health" | jq -r '.status // empty' 2>/dev/null)" = "ok" ] \
              && [ "$(printf '%s' "$health" | jq -r '.version // empty')" = "$VERSION" ]; then
              echo "Smoke tests OK : $health"
              exit 0
            fi
            echo "[$i/40] front pas encore prêt (/api/health : ${health:-aucune réponse})"
            sleep 15
          done
          echo "::error::Smoke tests de production en échec."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Production : $VERSION"
            echo
            echo "- Image : \`$REF\`"
            echo "- Migrations : $([ "$MIGRATE" = "true" ] && echo "jouées" || echo "non jouées (rollback)")"
            echo "- Front : $FRONT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
