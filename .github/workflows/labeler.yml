name: PR — Labels

# Étiquette les PR selon leur branche et les fichiers modifiés (.github/labeler.yml).
# `pull_request_target` : nécessaire pour écrire les labels sur une PR venant d'un fork ou de
# Dependabot. Sûr ici car le workflow ne récupère ni n'exécute le code de la PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    # La PR de release (dev → main) est étiquetée `release` par release-prepare.yml.
    if: github.event.pull_request.head.ref != 'dev'
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
