name: E2E — Playwright

on:
  push:
    branches: [main, dev]
  # Pas de filtre `paths` : ce check est requis par le ruleset de dev/main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost

    steps:
      - uses: actions/checkout@v4

      # --- Stack Docker (images de prod, comme en production) ---------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build des images à partir de compose.yaml, en réutilisant le cache GHA
      # du workflow Docker (mêmes cibles, mêmes scopes `php` / `web`).
      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: php,web
          load: true
          # Noms attendus par `docker compose` (projet `mangadex`) pour éviter un second build.
          set: |
            php.tags=mangadex-php:latest
            web.tags=mangadex-web:latest
            php.cache-from=type=gha,scope=php
            web.cache-from=type=gha,scope=web

      # compose.yaml seul : pas de surcharge de dev (volumes de code, Xdebug…).
      - name: Start stack
        run: docker compose -f compose.yaml up -d --no-build --wait

      - name: Wait for proxy
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost/ -o /dev/null

      # --- Playwright --------------------------------------------------------

      - name: Setup Node (version de web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web
        run: npm run test:e2e

      # --- Diagnostic en cas d'échec ------------------------------------------

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

      - name: Docker Compose logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml down -v
